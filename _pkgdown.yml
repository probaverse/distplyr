url: https://distplyr.probaverse.com/

# Keep the published site on the released version. A development
# version (one with a fourth number) builds to /dev/ instead, so the
# documentation people read never runs ahead of the release they have.
development:
  mode: auto
template:
  bootstrap: 5
  includes:
    in_header: |
      <!-- Google tag (gtag.js) -->
      <script async src="https://www.googletagmanager.com/gtag/js?id=G-VRP7BMY266"></script>
      <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-VRP7BMY266');
      </script>

articles:
- title: User Guides
  navbar: ~
  contents:
  - manipulating
